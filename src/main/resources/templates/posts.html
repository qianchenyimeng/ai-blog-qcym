<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Posts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <h1>Posts</h1>
    <form th:action="@{/posts/search}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Search posts...">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>
    <a th:href="@{/posts/new}" class="btn btn-primary mb-3">New Post</a>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Title</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.title}">Title</td>
            <td th:text="${#temporals.format(post.createdAt, 'dd-MM-yyyy HH:mm')}">Created At</td>
            <td>
                <a th:href="@{/posts/{postId}(postId=${post.id})}" class="btn btn-info">View</a>
                <a th:href="@{/posts/{postId}/edit(postId=${post.id})}" class="btn btn-primary">Edit</a>
                <a th:href="@{/posts/{postId}/delete(postId=${post.id})}" class="btn btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
