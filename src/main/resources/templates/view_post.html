<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">View Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 th:text="${post.title}">Post Title</h1>
    <p><em>Created on <span th:text="${#temporals.format(post.createdAt, 'dd-MM-yyyy HH:mm')}"></span></em></p>
    <div th:utext="${post.content}">
        Post content
    </div>
    <div>
        <strong>Tags:</strong>
        <span th:each="tag : ${post.tags}">
            <a th:href="@{/posts/tag/{tagName}(tagName=${tag.name})}" th:text="${tag.name}" class="badge bg-primary"></a>
        </span>
    </div>
    <a th:href="@{/posts}" class="btn btn-primary">Back to Posts</a>
    <hr/>
    <h3>Comments</h3>
    <div th:each="comment : ${post.comments}">
        <p><strong th:text="${comment.name}"></strong> - <span th:text="${#temporals.format(comment.createdAt, 'dd-MM-yyyy HH:mm')}"></span></p>
        <p th:text="${comment.content}"></p>
    </div>
    <hr/>
    <h3>Leave a comment</h3>
    <form th:action="@{/posts/{postId}/comments(postId=${post.id})}" th:object="${comment}" method="post">
        <div class="form-group mb-3">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" class="form-control" th:field="*{name}" required>
        </div>
        <div class="form-group mb-3">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" th:field="*{email}" required>
        </div>
        <div class="form-group mb-3">
            <label for="content">Comment</label>
            <textarea id="content" name="content" class="form-control" th:field="*{content}" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
</body>
</html>
